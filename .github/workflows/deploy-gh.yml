# Build and deploy the static Next.js export to GitHub Pages.
# Repo Actions variables (vars.*) are mapped into the build so Next can inline NEXT_PUBLIC_*.
# Do not set static_site_generator: next — this is a custom-domain site (donis.dev)
# and next.config.ts already sets output: "export" and images.unoptimized.
name: Deploy Next.js site to Pages

on:
   workflow_dispatch:

permissions:
   contents: read
   pages: write
   id-token: write

concurrency:
   group: "pages"
   cancel-in-progress: false

jobs:
   build:
      runs-on: ubuntu-latest
      steps:
         - name: Checkout
           uses: actions/checkout@v4

         - name: Setup pnpm
           uses: pnpm/action-setup@v4
           with:
              version: 11

         - name: Setup Node
           uses: actions/setup-node@v4
           with:
              node-version: "24"
              cache: pnpm

         - name: Setup Pages
           uses: actions/configure-pages@v5

         - name: Restore Next.js cache
           uses: actions/cache@v4
           with:
              path: |
                 .next/cache
              key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
              restore-keys: |
                 ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

         - name: Install dependencies
           run: pnpm install --frozen-lockfile

         - name: Build with Next.js
           env:
              NEXT_TELEMETRY_DISABLED: "1"
              TZ: Europe/Istanbul
              NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME }}
              NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
              NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
              NEXT_PUBLIC_ENABLE_SITE: ${{ vars.NEXT_PUBLIC_ENABLE_SITE }}
           run: pnpm run build

         - name: Upload artifact
           uses: actions/upload-pages-artifact@v3
           with:
              path: ./out

   deploy:
      environment:
         name: github-pages
         url: ${{ steps.deployment.outputs.page_url }}
      runs-on: ubuntu-latest
      needs: build
      steps:
         - name: Deploy to GitHub Pages
           id: deployment
           uses: actions/deploy-pages@v5
